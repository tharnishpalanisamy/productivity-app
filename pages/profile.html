        <div class="productivity-section">
            <p class="text-light totalContribution mt-2">contributions in 2026</p>
            <div class="heatmap">

                <div class="month-label">
                    <span>Jan</span>
                    <span>Feb</span>
                    <span>Mar</span>
                    <span>Apr</span>
                    <span>May</span>
                    <span>Jun</span>
                    <span>Jul</span>
                </div>

                <div class="div">
                    <div class="day-labels">
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                    <span>Sun</span>
                </div>
                <div class="grid-container">

                </div>
                </div>
                <div class="info">
                    <span>Less</span>
                    <div class="block zero"></div> 
                    <div class="block low"></div>
                    <div class="block medium"></div>
                    <div class="block high"></div>
                    <span>More</span>
                </div>
            </div>


            <div class="cards">
                <div class="stats-card">
                    <h4 class="sessionCount">0</h4>
                    <p class="text-secondary">Sessions</p>
                </div>

                <div class="stats-card">
                    <h4 class="hoursCount">0</h4>
                    <p class="text-secondary">Focus Time</p>
                </div>  

                <div class="stats-card">
                    <h4 class="streakCount">0</h4>
                    <p class="text-secondary">Day Streak</p>
                </div>

                <div class="stats-card">
                    <h4 class="thisMonth">0</h4>
                    <p class="text-secondary">This Month</p>
                </div>

    <!--Edit profile Modal-->
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <p class="modal-title fw-medium" id="exampleModalLabel">Edit Profile</p>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

            <div class="mt-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="profile-input" id="name" placeholder="Enter your name">
            </div>

            <div class="mt-3">
                <label for="username" class="form-label">username</label>
                <input type="username" class="profile-input" id="username" placeholder="Enter your username">
            </div>

            <div class="mt-3">
                <label for="mood" class="form-label">Mood</label>
                <select class="profile-input" id="mood">
                    <option value="focused">🎯 Focused</option>
                    <option value="productive">⚡ Productive</option>
                    <option value="chill">😌 Chill</option>
                    <option value="motivated">🔥 Motivated</option>
                    <option value="tired">😴 Tired</option>
                </select>
            </div>

        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">close</button>
            <button type="button" class="btn btn-success saveBtn">Save changes</button>
        </div>
        </div>
    </div>
    </div>
