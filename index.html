<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time to focus !</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/game.css">
    <link rel="shortcut icon" id="favicon" href="assets/favicon/blue.ico" type="image/x-icon">

</head>

<body>
    <nav class="nav-bar">
        <div class="brand">
            <img src="assets/images/logo.png" alt="" class="logo">
            <h2 class="brand-text">Tempo</h2>
        </div>
        <div class="options">
            <div class="profile">
                <a href="pages/profile.html"><i class="fa-regular fa-circle-user profile-logo"></i></a>
            </div>
        </div>
    </nav>

    <div class="pomodoro">
        <div class="btn-container">
            <button class="pomo-btn pomodoro-btn active">Pomodoro</button>
            <button class="pomo-btn shortBreak-btn">Short Break</button>
            <button class="pomo-btn longBreak-btn">Long Break</button>
        </div>
        <div class="timer-container"> 
            <h1 class="timer">30:00</h1>
        </div>
        <div class="start-btn-container">
            <button class="pomodoro-timer-btn">
                <span class="start-text">Start</span>
                <span class="spinner-border spinner-border-sm start-spinner d-none"></span>
            </button>
        </div>
    </div>

<section class="task-container">
    <div class="task-content">
        <div class="task-text text-center">
            <p class="text-secondary p-0 m-0">#1</p>
            <p class="m-0 p-0">Time to focus!</p>
        </div>

        <div class="tasks">
            
        </div>

        <button class="add-task-button">
        <i class="fa-solid fa-circle-plus"></i>
        Add Task
    </button>
    </div>
    
</section>


<!--Short break--> 
<section class="shortBreak-container">
    <div class="shortBreak-content">

        <p class="shortBreak-p">
            Take a quick brain break
        </p>

        <div class="games-container">

            <button class="game" data-game="tenzies" data-bs-toggle="modal" data-bs-target="#gameModal">
                <div class="game-icon tenzies-icon">
                    <i class="bi bi-dice-5-fill"></i>
                </div>
                <span>Tenzies</span>
            </button>

            <button class="game" data-game="reaction" data-bs-toggle="modal"
             data-bs-target="#gameModal" id="reactionGame">
                <div class="game-icon reaction-icon">
                    <i class="bi bi-lightning-charge-fill"></i>
                </div>
                <span>Reaction Time</span>
            </button>

            <button class="game" data-game="tictactoe" data-bs-toggle="modal" data-bs-target="#gameModal">
                <div class="game-icon tictactoe-icon">
                    <span>XO</span>
                </div>
                <span>Tic Tac Toe</span>
            </button>

            <button class="game" data-game="rps">
                <div class="game-icon rps-icon">
                    <i class="fa-solid fa-hand-scissors"></i>
                </div>
                <span>Rock Paper Scissors</span>
            </button>

            <button class="game" data-game="memory">
                <div class="game-icon memory-icon">
                    <i class="bi bi-layers-fill"></i>
                </div>
                <span>Memory Game</span>
            </button>


            <button class="game" data-game="math"  >
                <div class="game-icon math-icon">
                    <i class="bi bi-calculator-fill"></i>
                </div>
                <span>Math Quiz</span>
            </button>

        </div>
    </div>
</section>


<!--Long Break--> 
<section class="longBreak-container">
    <div class="longBreak-content">
        <p class="shortBreak-p" >Dont have Anything to do ? spend your long break Here !</p>
    </div>
</section>

<!-- Hidden initially -->
<div class="add-task d-none">
    <input
        type="text"
        class="title"
        placeholder="What are you working on?"
    >

    <p class="session-label">Estimate sessions</p>

    <div class="session-controls">
        <input type="number" class="pomo-input" value="1" min="1">

        <button class="subtractSession" type="button">−</button>
        <button class="addSession" type="button">+</button>
    </div>

    <div class="add-task-footer">
        <div class="add-task-btn-container">
            <button class="cancel-btn">Cancel</button>
            <button class="save-task-btn">Save</button>
        </div>
    </div>
</div>



<!--game modal-->
<!-- Modal -->
<div class="modal fade"
     id="gameModal"
     data-bs-backdrop="static"
     data-bs-keyboard="false"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content tictactoeContainer">
            <div class="modal-header">
                <h1 class="modal-title fs-5">
                    Tic Tac Toe
                </h1>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body game-modal">

                <div class="tic-tac-toe">

                    <p class="game-status text-center">
                        Player X's turn
                    </p>

                    <div class="tic-board">
                        <button class="tic-cell" data-index="0"></button>
                        <button class="tic-cell" data-index="1"></button>
                        <button class="tic-cell" data-index="2"></button>

                        <button class="tic-cell" data-index="3"></button>
                        <button class="tic-cell" data-index="4"></button>
                        <button class="tic-cell" data-index="5"></button>

                        <button class="tic-cell" data-index="6"></button>
                        <button class="tic-cell" data-index="7"></button>
                        <button class="tic-cell" data-index="8"></button>
                    </div>

                    <div class="text-center mt-4">
                        <button class="btn btn-primary restart-game">
                            Play Again
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <div class="modal-content tenziesContainer">
            <div class="modal-header">
                <h1 class="modal-title fs-5">
                    Tenzies
                </h1>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>


            <div class="modal-body">
                <div class="tenzies-text">
                    <p>Roll the dice and see what you got !</p>  
                    <p class="tenzies-win"></p>
                </div>

                <div class="dice-container">
                    <button class="die" data-status = 'notSelected'>1</button>
                    <button class="die" data-status = 'notSelected'>2</button>
                    <button class="die" data-status = 'notSelected'>3</button>
                    <button class="die" data-status = 'notSelected'>4</button>
                    <button class="die" data-status = 'notSelected'>3</button>
                    <button class="die" data-status = 'notSelected'>5</button>
                    <button class="die" data-status = 'notSelected'>3</button>
                    <button class="die" data-status = 'notSelected'>2</button>
                    <button class="die" data-status = 'notSelected'>4</button>
                    <button class="die" data-status = 'notSelected'>3</button>
                </div>
                <button class="rollDice">Roll Dice</button>
            </div>
        </div>

        <!--Reaction time-->
        <div class="modal-content reactionContainer reaction-waiting">
            <div class="modal-header">
                <h1 class="modal-title fs-5 text-light">
                    Reaction time
                </h1>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>


            <div class="modal-body reactionGame-body"> 
                    <h1 class="dot">...</h1>
                    <h1 class="reaction-text">Wait for Green</h1>  
            </div>
        </div>


    </div>
</div>












    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="scripts/script.js" type="module"></script>
    <script src="scripts/todolist.js" type="module"></script>
    <script src="scripts/game.js" type="module"></script>
</body>
</html>
