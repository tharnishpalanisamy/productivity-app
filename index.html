<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time to focus !</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>
    
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="shortcut icon" id="favicon" href="assets/favicon/blue.ico" type="image/x-icon">

</head>

<body>
    <nav class="nav-bar">
        <div class="brand">
            <img src="assets/images/logo.png" alt="" class="logo">
            <h2 class="brand-text">Tempo</h2>
        </div>
        <div class="options">
            <div class="profile">
                <a href="pages/profile.html"><i class="fa-regular fa-circle-user profile-logo"></i></a>
            </div>
        </div>
    </nav>

    <div class="pomodoro">
        <div class="btn-container">
            <button class="pomo-btn pomodoro-btn active">Pomodoro</button>
            <button class="pomo-btn shortBreak-btn">Short Break</button>
            <button class="pomo-btn longBreak-btn">Long Break</button>
        </div>
        <div class="timer-container"> 
            <h1 class="timer">30:00</h1>
        </div>
        <div class="start-btn-container">
            <button class="pomodoro-timer-btn">
                <span class="start-text">Start</span>
                <span class="spinner-border spinner-border-sm start-spinner d-none"></span>
            </button>
        </div>
    </div>

<section class="task-container">
    <div class="task-content">
        <div class="task-text">
            <p class="text-secondary p-0 m-0">#1</p>
            <p class="m-0 p-0">Time to focus!</p>
        </div>

        <div class="tasks">
            
        </div>

        <button class="add-task-button">
        <i class="fa-solid fa-circle-plus"></i>
        Add Task
    </button>
    </div>
    
</section>

<!-- Hidden initially -->
<div class="add-task d-none">
    <input
        type="text"
        class="title"
        placeholder="What are you working on?"
    >

    <p class="session-label">Estimate sessions</p>

    <div class="session-controls">
        <input type="number" class="pomo-input" value="1" min="1">

        <button class="subtractSession" type="button">−</button>
        <button class="addSession" type="button">+</button>
    </div>

    <div class="add-task-footer">
        <div class="add-task-btn-container">
            <button class="cancel-btn">Cancel</button>
            <button class="save-task-btn">Save</button>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
